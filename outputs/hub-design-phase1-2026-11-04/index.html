<html lang="en">

<title>Training Hub — design preview</title>
<style>
:root{--ink:#172b3a;--muted:#526575;--accent:#0b7169;--border:#cbd5df;--soft:#f2f6f8;--surface:#fff;--space:24px;font:16px/1.6 Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);background:#f4f6f9}
*{box-sizing:border-box}body{margin:0}a{color:var(--accent);text-underline-offset:3px}button,input,select{font:inherit}button,a,input,select{touch-action:manipulation}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid #204b91;outline-offset:3px}button:disabled{cursor:not-allowed}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(1.75rem,3vw,2.5rem);line-height:1.18;letter-spacing:-.04em;margin-bottom:12px}h2{font-size:1.22rem;line-height:1.35;margin-bottom:12px}h3{font-size:1.05rem;line-height:1.4;margin-bottom:8px}p{margin-bottom:16px}small,.muted{color:var(--muted)}small{font-size:.83rem}svg{flex:none}.skip{position:fixed;left:12px;top:-100px;z-index:10;background:white;padding:12px}.skip:focus{top:12px}
.preview{background:#e7edf4;border-bottom:1px solid var(--border);font-size:.78rem;color:#334b5b;padding:9px 28px;display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap}.preview strong{font-weight:650}.topbar{min-height:88px;background:white;border-bottom:1px solid var(--border);padding:16px 32px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);font-size:1rem;font-weight:750}.mark{display:grid;place-items:center;background:var(--accent);color:white;border-radius:10px;width:40px;height:40px;font-size:1.15rem}.brand small{display:block;font-weight:400;font-size:.75rem}.top-actions{display:flex;align-items:center;gap:22px}.language{display:flex;gap:2px;background:var(--soft);padding:4px;border:1px solid var(--border);border-radius:9px}.language button{border:0;background:transparent;border-radius:5px;color:var(--muted);padding:6px 10px;min-height:36px;font-size:.8rem;font-weight:650}.language button[aria-pressed=true]{background:var(--accent);color:white}.person{text-align:right;font-size:.85rem}.person small{display:block}.shell{display:grid;grid-template-columns:224px minmax(0,1fr);max-width:1536px;margin:auto}.sidebar{padding:32px 16px}.eyebrow{font-size:.68rem;font-weight:750;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}.sidebar .eyebrow{margin-left:12px}.sidebar nav{display:grid;gap:6px}.sidebar nav a{padding:11px 12px;min-height:46px;text-decoration:none;font-size:.87rem;font-weight:600;color:#334b5b;border-radius:8px;display:flex;align-items:center;gap:12px}.sidebar nav a[aria-current=page]{color:#075e57;background:#dceee9;box-shadow:inset 3px 0 var(--accent)}.sidebar nav a:hover{background:#e8f0f1}.navicon{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7}.sidebar-note{margin:28px 12px 0;padding-top:20px;border-top:1px solid var(--border);font-size:.76rem;color:var(--muted)}main{min-width:0;padding:36px 36px 56px 12px}.heading{margin-bottom:28px}.heading p:last-child{margin-bottom:0;color:var(--muted);max-width:70ch}.grid{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(240px,1fr);gap:24px}.stack{display:grid;gap:24px;align-content:start}.card{border:1px solid var(--border);border-radius:12px;background:white;padding:24px;min-width:0}.hero{border-top:4px solid var(--accent);padding:28px}.hero h2{font-size:1.7rem;letter-spacing:-.025em}.hero p{max-width:60ch;color:var(--muted)}.row{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}.row h2{margin:0}.button{display:inline-flex;justify-content:center;align-items:center;gap:8px;min-height:44px;padding:10px 17px;border-radius:7px;border:1px solid var(--accent);background:var(--accent);color:white;text-decoration:none;font-size:.88rem;font-weight:650}.button:hover{background:#085c55}.button.secondary{background:white;color:var(--accent);border-color:#839eaa}.button.secondary:hover{background:#edf5f3}.button:disabled{background:#edf1f5;color:var(--muted);border-color:var(--border)}.button-group{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}.tag{display:inline-block;font-size:.69rem;font-weight:650;line-height:1.5;padding:4px 9px;border-radius:5px;color:#28554d;background:#e8f3ef}.tag.neutral{color:#526575;background:#edf1f5}.tag.warn{color:#705315;background:#fff3d7}.meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-bottom:14px}.metric{font-size:2rem;line-height:1.2;font-weight:700;letter-spacing:-.035em}.track{height:7px;background:#e3eaf0;border-radius:20px;overflow:hidden;margin:16px 0 10px}.track span{display:block;height:100%;background:var(--accent);border-radius:20px}.course-row{padding:20px 0;border-bottom:1px solid #e6ecf0;display:flex;gap:20px;align-items:flex-start}.course-row:last-child{border-bottom:0;padding-bottom:0}.course-row .content{flex:1}.number{flex:none;display:grid;place-items:center;width:38px;height:38px;background:var(--soft);border:1px solid var(--border);border-radius:9px;font-weight:650;font-size:.84rem}.course-row p{font-size:.86rem;margin-bottom:10px;color:var(--muted)}.note{padding:14px 16px;border-radius:8px;background:var(--soft);font-size:.85rem;color:var(--muted)}.note p:last-child{margin:0}.list{margin:0;padding-left:20px;color:var(--muted);font-size:.88rem}.list li{margin:8px 0}.toolbar{display:grid;grid-template-columns:minmax(160px,1fr) 220px;gap:18px;margin-bottom:16px}label{display:block;font-size:.82rem;font-weight:650;margin-bottom:6px}input,select{width:100%;border:1px solid #889baa;color:var(--ink);background:white;border-radius:7px;min-height:46px;padding:10px 12px;min-width:0}.catalog-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.catalog-card{display:flex;flex-direction:column;gap:8px}.catalog-card p{font-size:.87rem;color:var(--muted);flex:1}.catalog-card h2{margin:0}.catalog-card .button{align-self:flex-start}.breadcrumb{font-size:.8rem;margin-bottom:24px;display:flex;gap:8px;flex-wrap:wrap;color:var(--muted)}.lesson-grid{display:grid;grid-template-columns:240px minmax(0,1fr);gap:24px}.steps{padding:20px}.steps ol{list-style:none;padding:0;margin:14px 0 0}.steps li{font-size:.83rem;padding:12px 10px;border-radius:7px;color:var(--muted);display:flex;gap:10px}.steps li[aria-current=step]{background:#e4f2ee;color:#075e57;font-weight:650}.lesson{padding:32px;max-width:820px}.lesson p{max-width:70ch}.lesson .note{border-left:3px solid var(--accent);margin:24px 0}.status-line{font-size:.85rem;color:var(--muted);margin-top:16px;min-height:1.5em}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-bottom:24px}.stats h2{font-size:.84rem;color:var(--muted);font-weight:500}.stats small{display:block;margin-top:8px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;text-align:left;font-size:.85rem}caption{text-align:left;font-size:.8rem;color:var(--muted);margin-bottom:14px}th{font-size:.7rem;letter-spacing:.04em;color:var(--muted);font-weight:650}td,th{padding:15px 12px;border-bottom:1px solid #e5ebef}td:first-child{padding-left:0}th:first-child{padding-left:0}td small{display:block}tr:last-child td{border-bottom:0}.coach-actions{margin-top:20px;display:flex;gap:12px;flex-wrap:wrap}.footer{max-width:1536px;margin:auto;padding:18px 32px;border-top:1px solid var(--border);font-size:.75rem;color:var(--muted)}[hidden]{display:none!important}
@media(max-width:1000px){.grid{grid-template-columns:minmax(0,1fr)}.shell{grid-template-columns:195px minmax(0,1fr)}main{padding:28px 24px 40px 8px}.lesson-grid{grid-template-columns:minmax(0,1fr)}.steps ol{display:flex;flex-wrap:wrap}.stats{gap:12px}.stats .card{padding:18px}.catalog-grid{grid-template-columns:minmax(0,1fr)}}
@media(max-width:700px){.topbar{padding:16px;align-items:flex-start;gap:14px}.top-actions{gap:10px;align-items:flex-end;flex-direction:column}.person{font-size:.72rem}.brand{font-size:.85rem;gap:8px}.brand small{font-size:.65rem}.mark{width:32px;height:32px}.language button{padding:5px 8px}.preview{padding:8px 16px;font-size:.7rem}.shell{display:block}.sidebar{padding:16px 12px 0}.sidebar .eyebrow,.sidebar-note{display:none}.sidebar nav{grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}.sidebar nav a{font-size:.8rem;padding:9px}.navicon{width:16px;height:16px}main{padding:24px 16px 36px}.heading{margin-bottom:22px}.card,.hero,.lesson{padding:20px}.hero h2{font-size:1.35rem}.grid,.stack{gap:18px}.toolbar{grid-template-columns:minmax(0,1fr)}.stats{grid-template-columns:minmax(0,1fr)}.stats .card{display:grid;grid-template-columns:1fr auto;gap:4px 12px}.stats h2{margin:0}.stats small{grid-column:1/-1;margin:0}.metric{font-size:1.7rem}.course-row{gap:12px}.course-row .row{gap:10px}.number{width:30px;height:30px}.footer{padding:18px 16px}.steps li{padding:8px}.lesson-grid{gap:16px}}
@media(max-width:700px){.table-wrap{overflow:visible}table,caption,tbody{display:block}thead{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}tbody{display:grid;gap:16px}tr{display:block;padding:12px;border:1px solid var(--border);border-radius:8px}td,td:first-child{display:block;padding:6px 0;border:0}td::before{display:block;font-size:.65rem;font-weight:650;letter-spacing:.04em;color:var(--muted);margin-bottom:3px}td:nth-child(1)::before{content:'LEARNER'}td:nth-child(2)::before{content:'TRAINING NEED'}td:nth-child(3)::before{content:'STATUS'}html:lang(es) td:nth-child(1)::before{content:'PARTICIPANTE'}html:lang(es) td:nth-child(2)::before{content:'NECESIDAD DE FORMACIÓN'}html:lang(es) td:nth-child(3)::before{content:'ESTADO'}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

<body><a class="skip" href="#main">Skip to preview</a><div class="preview"><strong id="preview-label"></strong><span id="preview-note"></span></div><header class="topbar"><a class="brand" href="#home"><span class="mark" aria-hidden="true">T</span><span>Trez Training Hub<small id="brand-note"></small></span></a><div class="top-actions"><div class="language" role="group" aria-label="Language"><button type="button" lang="en" data-language="en" aria-pressed="true">English</button><button type="button" lang="es" data-language="es" aria-pressed="false">Español</button></div><div class="person"><span id="person-name"></span><small id="person-role"></small></div></div></header><div class="shell"><aside class="sidebar"><p class="eyebrow" id="nav-label"></p><nav aria-label="Preview screens" id="nav"></nav><p class="sidebar-note" id="sidebar-note"></p></aside><main id="main" tabindex="-1"></main></div><footer class="footer" id="footer"></footer>
<script>
let locale='en';
const t=(en,es)=>locale==='es'?es:en;
const escapeText=value=>String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const icon=kind=>`<svg aria-hidden="true" class="navicon" viewBox="0 0 24 24">${kind==='home'?'<path d="m3 10 9-7 9 7v10H3Z M9 20v-7h6v7"/>':kind==='catalog'?'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>':kind==='module'?'<path d="M3 4h7l2 2 2-2h7v15h-7l-2 2-2-2H3Z M12 6v15"/>':'<circle cx="9" cy="8" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3 M16 5a3 3 0 0 1 0 6 M18 15a5 5 0 0 1 3 5"/>'}</svg>`;
const label=view=>({home:t('My training','Mi formación'),catalog:t('Module catalog','Catálogo de módulos'),module:t('Module workspace','Espacio del módulo'),trainer:t('Capacitador overview','Vista del Capacitador')})[view];
const button=(text,view,secondary=false)=>`<a class="button${secondary?' secondary':''}" href="#${view}">${text}</a>`;
const tag=(text,style='')=>`<span class="tag ${style}">${text}</span>`;
const heading=(eyebrow,title,summary)=>`<div class="heading"><p class="eyebrow">${eyebrow}</p><h1>${title}</h1><p>${summary}</p></div>`;
const rows=()=>[
{id:'work',number:'01',title:t('Understanding the work','Comprender el trabajo'),summary:t('The operator’s responsibilities, balances and verification habits.','Las responsabilidades del operador, los saldos y los hábitos de verificación.'),state:'completed',type:t('Foundations','Fundamentos')},
{id:'search',number:'04',title:t('Find the right customer','Encontrar al cliente correcto'),summary:t('Practice exact customer search before changing an account or balance.','Practique la búsqueda exacta del cliente antes de modificar una cuenta o un saldo.'),state:'available',type:t('Operational practice','Práctica operativa')},
{id:'balance',number:'05',title:t('Verify the balance','Verificar el saldo'),summary:t('Compare the customer and game records before proceeding.','Compare los registros del cliente y del juego antes de continuar.'),state:'locked',type:t('Operational practice','Práctica operativa')},
{id:'credit',number:'06',title:t('Add credits safely','Agregar créditos con seguridad'),summary:t('Follow the verification, approval and evidence chain.','Siga la secuencia de verificación, aprobación y evidencia.'),state:'locked',type:t('Operational practice','Práctica operativa')}
];
const stateLabel=state=>({available:t('Available','Disponible'),completed:t('Completed','Completado'),locked:t('Prerequisite required','Requisito previo pendiente')})[state];
function home(){return heading(t('YOUR LEARNING PATH','SU RUTA DE APRENDIZAJE'),t('A clear next step.','El siguiente paso, claro.'),t('Continue your assigned training or revisit a skill with your Capacitador.','Continúe su formación asignada o refuerce una habilidad con su Capacitador.'))+`<div class="grid"><div class="stack"><section class="card hero"><div class="meta">${tag(t('Continue learning','Continuar formación'))}<span>${t('Module 4 · Operator foundations','Módulo 4 · Fundamentos del operador')}</span></div><h2>${t('Find the right customer','Encontrar al cliente correcto')}</h2><p>${t('You have completed the orientation. Next, practice verifying the exact customer before taking action.','Ya completó la orientación. Ahora practique cómo verificar al cliente exacto antes de actuar.')}</p><div class="note">${t('Next activity: exact search and customer verification.','Siguiente actividad: búsqueda exacta y verificación del cliente.')}</div><div class="button-group">${button(t('Continue module','Continuar módulo'),'module')}${button(t('Browse modules','Explorar módulos'),'catalog',true)}</div></section><section class="card"><div class="row"><h2>${t('Assigned training','Formación asignada')}</h2><a href="#catalog">${t('View catalog','Ver catálogo')}</a></div>${rows().slice(0,2).map(row=>`<div class="course-row"><span class="number">${row.number}</span><div class="content"><div class="row"><h3>${row.title}</h3>${tag(stateLabel(row.state),row.state==='completed'?'':'neutral')}</div><p>${row.summary}</p><a href="#${row.state==='completed'?'catalog':'module'}">${t('View module','Ver módulo')}</a></div></div>`).join('')}</section></div><div class="stack"><section class="card"><p class="eyebrow">${t('COURSE PROGRESS','PROGRESO DEL CURSO')}</p><div class="metric">3 <small>/ 15 ${t('modules','módulos')}</small></div><div class="track" role="progressbar" aria-label="${t('Sample course progress','Progreso de ejemplo')}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="20"><span style="width:20%"></span></div><small>${t('Learning progress · sample data','Progreso de aprendizaje · datos de ejemplo')}</small><p class="note" style="margin-top:20px;margin-bottom:0">${t('Formal evaluations require an approved policy. Learning progress is not a certification.','Las evaluaciones formales requieren una política aprobada. El progreso no equivale a una certificación.')}</p></section><section class="card"><h2>${t('Feedback to put into practice','Comentarios para aplicar')}</h2><p class="muted">${t('“Confirm the exact customer before making a change.”','«Confirme al cliente exacto antes de realizar un cambio».')}</p><small>${t('Example feedback · not a real learner record','Comentario de ejemplo · no es un registro real')}</small></section><section class="card"><h2>${t('Already working?','¿Ya está trabajando?')}</h2><p class="muted">${t('Ask your Capacitador for targeted reinforcement. Your previous results stay in your history.','Solicite refuerzo específico a su Capacitador. Sus resultados anteriores permanecen en el historial.')}</p></section></div></div>`;}
function catalog(){return heading(t('ASSIGNED TRAINING','FORMACIÓN ASIGNADA'),t('Find your next skill.','Encuentre su próxima habilidad.'),t('Explore assigned modules. Prerequisites explain what you can open next.','Explore los módulos asignados. Los requisitos indican qué puede abrir después.'))+`<section class="card" style="margin-bottom:24px"><div class="toolbar"><div><label for="search">${t('Search modules','Buscar módulos')}</label><input id="search" type="search" placeholder="${t('Search a title or skill','Buscar un título o una habilidad')}"></div><div><label for="availability">${t('Availability','Disponibilidad')}</label><select id="availability"><option value="all">${t('All assigned modules','Todos los módulos asignados')}</option><option value="available">${t('Available','Disponibles')}</option><option value="completed">${t('Completed','Completados')}</option><option value="locked">${t('Prerequisite required','Con requisito pendiente')}</option></select></div></div><small>${t('Operator foundations · example assignment','Fundamentos del operador · asignación de ejemplo')}</small></section><p id="result-count" class="muted" role="status"></p><div id="catalog-results" class="catalog-grid"></div>`;}
function updateCatalog(){const search=document.getElementById('search');if(!search)return;const term=search.value.toLocaleLowerCase(locale).trim();const state=document.getElementById('availability').value;const selected=rows().filter(row=>(state==='all'||row.state===state)&&`${row.title} ${row.summary} ${row.type}`.toLocaleLowerCase(locale).includes(term));document.getElementById('result-count').textContent=t(`${selected.length} example modules shown`,`${selected.length} módulos de ejemplo`);document.getElementById('catalog-results').innerHTML=selected.length?selected.map(row=>`<article class="card catalog-card"><div class="meta"><span>${t('Module','Módulo')} ${row.number}</span>${tag(stateLabel(row.state),row.state==='locked'?'neutral':'')}</div><h2>${row.title}</h2><small>${row.type}</small><p>${row.summary}</p>${row.state==='locked'?`<div class="note">${t('Complete the previous module to open this practice.','Complete el módulo anterior para abrir esta práctica.')}</div><button class="button" disabled>${t('Not available yet','Aún no disponible')}</button>`:button(t('View module','Ver módulo'),row.id==='search'?'module':'home',true)}</article>`).join(''):`<section class="card"><h2>${t('No matching modules','No hay módulos coincidentes')}</h2><p>${t('Try another search or reset the filters.','Pruebe otra búsqueda o restablezca los filtros.')}</p><button class="button secondary" id="reset">${t('Reset filters','Restablecer filtros')}</button></section>`;document.getElementById('reset')?.addEventListener('click',()=>{search.value='';document.getElementById('availability').value='all';updateCatalog();search.focus();});}
function moduleView(){return `<nav class="breadcrumb" aria-label="${t('Breadcrumb','Ruta de navegación')}"><a href="#home">${t('My training','Mi formación')}</a><span aria-hidden="true">/</span><a href="#catalog">${t('Module catalog','Catálogo de módulos')}</a><span aria-hidden="true">/</span><span>${t('Module 4','Módulo 4')}</span></nav>`+heading(t('MODULE 4 · OPERATOR FOUNDATIONS','MÓDULO 4 · FUNDAMENTOS DEL OPERADOR'),t('Find the right customer','Encontrar al cliente correcto'),t('Verify identity and the exact account before taking action.','Verifique la identidad y la cuenta exacta antes de actuar.'))+`<div class="lesson-grid"><aside class="card steps" aria-label="${t('Module steps','Pasos del módulo')}"><h2>${t('In this module','En este módulo')}</h2><ol><li aria-current="step"><span>01</span>${t('Understand exact search','Comprender la búsqueda exacta')}</li><li><span>02</span>${t('Guided practice','Práctica guiada')}</li><li><span>03</span>${t('Independent practice','Práctica independiente')}</li></ol><div class="note" style="margin-top:16px">${t('Prerequisites complete in this sample.','Requisitos completos en este ejemplo.')}</div></aside><section class="card lesson"><div class="meta">${tag(t('Learning activity','Actividad de aprendizaje'))}${tag(t('Non-scored preview','Vista previa sin puntuación'),'neutral')}</div><h2>${t('Start with the exact customer','Comience por el cliente exacto')}</h2><p>${t('A similar name is not enough. Confirm the customer identifier and the selected game before opening or changing an account.','Un nombre similar no es suficiente. Confirme el identificador del cliente y el juego seleccionado antes de abrir o modificar una cuenta.')}</p><div class="note"><h3>${t('A habit worth reinforcing','Un hábito para reforzar')}</h3><p>${t('Search first. Verify the matching record. Only then continue with the requested operation.','Primero busque. Verifique el registro coincidente. Solo entonces continúe con la operación solicitada.')}</p></div><h3>${t('Before you continue','Antes de continuar')}</h3><ul class="list"><li>${t('Confirm the exact identifier.','Confirme el identificador exacto.')}</li><li>${t('Check the selected game and account.','Revise el juego y la cuenta seleccionados.')}</li><li>${t('Stop when the information does not match.','Deténgase si la información no coincide.')}</li></ul><div class="button-group"><button type="button" class="button" id="sample-complete">${t('Preview completion feedback','Ver confirmación de ejemplo')}</button>${button(t('Back to catalog','Volver al catálogo'),'catalog',true)}</div><p class="status-line" id="completion-notice" role="status"></p><small>${t('Design sample. This button does not save progress or start an assessment.','Ejemplo de diseño. Este botón no guarda progreso ni inicia una evaluación.')}</small></section></div>`;}
function trainer(){return heading(t('CAPACITADOR WORKSPACE','ESPACIO DEL CAPACITADOR'),t('Turn progress into guidance.','Convierta el progreso en orientación.'),t('Review the latest snapshot and decide where support will help most.','Revise la última consulta y decida dónde será más útil el apoyo.'))+`<div class="row" style="margin-bottom:24px"><p class="muted" id="snapshot" style="margin:0">${t('Sample snapshot · no live data','Consulta de ejemplo · sin datos reales')}</p><button type="button" class="button secondary" id="refresh">${t('Update preview','Actualizar vista previa')}</button></div><div class="stats">${[[t('Assigned learners','Participantes asignados'),'24',t('Example cohort population','Población de ejemplo del grupo')],[t('Need follow-up','Requieren seguimiento'),'3',t('Example support needs','Necesidades de apoyo de ejemplo')],[t('Evidence to review','Evidencia por revisar'),'2',t('Example review queue','Cola de revisión de ejemplo')]].map(([title,count,desc])=>`<section class="card"><h2>${title}</h2><div class="metric">${count}</div><small>${desc}</small></section>`).join('')}</div><div class="grid"><section class="card"><h2>${t('Where to focus next','Dónde concentrarse ahora')}</h2><div class="table-wrap" role="region" tabindex="0" aria-label="${t('Example learner follow-up','Seguimiento de ejemplo')}" ><table><caption>${t('Fictional people and assignments for design review only','Personas y asignaciones ficticias, solo para revisar el diseño')}</caption><thead><tr><th scope="col">${t('LEARNER','PARTICIPANTE')}</th><th scope="col">${t('TRAINING NEED','NECESIDAD DE FORMACIÓN')}</th><th scope="col">${t('STATUS','ESTADO')}</th></tr></thead><tbody><tr><td>${t('Example learner A','Participante de ejemplo A')}<small>${t('Existing employee','Personal en actividad')}</small></td><td>${t('Exact customer search','Búsqueda exacta del cliente')}</td><td>${tag(t('Reinforcement','Refuerzo'))}</td></tr><tr><td>${t('Example learner B','Participante de ejemplo B')}<small>${t('New learner','Nuevo participante')}</small></td><td>${t('Balance verification','Verificación del saldo')}</td><td>${tag(t('Needs guidance','Requiere orientación'),'warn')}</td></tr><tr><td>${t('Example learner C','Participante de ejemplo C')}<small>${t('New learner','Nuevo participante')}</small></td><td>${t('Operator foundations','Fundamentos del operador')}</td><td>${tag(t('In progress','En curso'),'neutral')}</td></tr></tbody></table></div><p class="note" style="margin-top:20px;margin-bottom:0">${t('In the product, each row will open authorized learner records and original evidence. This preview contains no real records.','En el producto, cada fila abrirá los registros autorizados y la evidencia original. Esta vista no contiene registros reales.')}</p></section><div class="stack"><section class="card"><h2>${t('Two different decisions','Dos decisiones distintas')}</h2><ul class="list"><li>${t('Reinforcement assigns focused learning or practice.','El refuerzo asigna aprendizaje o práctica específica.')}</li><li>${t('Formal reassessment requires permission, a reason and a preserved result history.','La reevaluación formal requiere permiso, un motivo y un historial conservado.')}</li></ul></section><section class="card"><h2>${t('Publication is a separate step','La publicación es un paso independiente')}</h2><p class="muted">${t('The four formal evaluations remain drafts until the required bilingual content and policy review is complete.','Las cuatro evaluaciones formales siguen en borrador hasta completar la revisión del contenido bilingüe y sus políticas.')}</p></section></div></div>`;}
function render(focus=false){const view=['home','catalog','module','trainer'].includes(location.hash.slice(1))?location.hash.slice(1):'home';const oldSearch=document.getElementById('search')?.value||'';const oldFilter=document.getElementById('availability')?.value||'all';document.documentElement.lang=locale;document.title=`${label(view)} — ${t('Training Hub design preview','Vista previa del diseño del Hub')}`;document.querySelector('.skip').textContent=t('Skip to preview','Saltar a la vista previa');document.getElementById('preview-label').textContent=t('DESIGN PREVIEW · SAMPLE DATA','VISTA PREVIA DEL DISEÑO · DATOS DE EJEMPLO');document.getElementById('preview-note').textContent=t('Four screens · no changes to the live Hub','Cuatro pantallas · sin cambios al Hub publicado');document.getElementById('brand-note').textContent=t('A place to learn, practice and grow','Un espacio para aprender, practicar y crecer');document.getElementById('person-name').textContent=t('Example account','Cuenta de ejemplo');document.getElementById('person-role').textContent=view==='trainer'?'Capacitador':t('Participant','Participante');document.getElementById('nav-label').textContent=t('PREVIEW SCREENS','PANTALLAS DE EJEMPLO');document.getElementById('nav').setAttribute('aria-label',t('Preview screens','Pantallas de ejemplo'));document.querySelector('.language').setAttribute('aria-label',t('Language','Idioma'));document.getElementById('nav').innerHTML=['home','catalog','module','trainer'].map(item=>`<a href="#${item}"${item===view?' aria-current="page"':''}>${icon(item)}${label(item)}</a>`).join('');document.getElementById('sidebar-note').textContent=t('These links switch design samples. Actual product access will continue to be enforced by the server.','Estos enlaces cambian ejemplos de diseño. El servidor seguirá controlando el acceso real al producto.');document.getElementById('footer').textContent=t('Design review only · learning progress, formal results and certification remain separate.','Solo para revisión del diseño · el progreso, los resultados formales y la certificación siguen separados.');document.getElementById('main').innerHTML=({home,catalog,module:moduleView,trainer}[view])();for(const control of document.querySelectorAll('[data-language]'))control.setAttribute('aria-pressed',String(control.dataset.language===locale));if(view==='catalog'){document.getElementById('search').value=oldSearch;document.getElementById('availability').value=oldFilter;document.getElementById('search').addEventListener('input',updateCatalog);document.getElementById('availability').addEventListener('change',updateCatalog);updateCatalog();}document.getElementById('sample-complete')?.addEventListener('click',()=>{document.getElementById('completion-notice').textContent=t('Example confirmation: activity complete. No progress was saved.','Confirmación de ejemplo: actividad completada. No se guardó progreso.');});document.getElementById('refresh')?.addEventListener('click',()=>{document.getElementById('snapshot').textContent=t('Preview refreshed. Sample values are unchanged; no server request was made.','Vista previa actualizada. Los valores de ejemplo no cambiaron; no se consultó al servidor.');});if(focus){document.querySelector('h1').tabIndex=-1;document.querySelector('h1').focus();window.scrollTo(0,0);}}
for(const control of document.querySelectorAll('[data-language]'))control.addEventListener('click',()=>{locale=control.dataset.language;render();});window.addEventListener('hashchange',()=>render(true));render();
</script></body></html>
